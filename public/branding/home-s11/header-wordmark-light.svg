              <circle id="r-inner-r-head-cap" cx="122.5" cy="482.5" r="73.25" fill="currentColor" />
              <circle id="r-inner-r-tail-cap" cx="388.562171280" cy="486.758538202" r="73.25" fill="currentColor" />
