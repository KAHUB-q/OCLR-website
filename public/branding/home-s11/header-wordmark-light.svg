            <g id="r-outer-r-slider-shape">
              <path id="r-outer-r-track" d="M122.5 482.5 A1948.265514393 1948.265514393 0 0 1 205.5 81.5 A137.043984736 137.043984736 0 1 1 178.5 283.5 L388.562171280 486.758538202" fill="none" stroke="#fff" stroke-width="163" stroke-linecap="round" stroke-linejoin="round" />
