<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 104 980 304">
  <!-- Letter shapes from oclr-layer.svg. Keep geometry aligned with the other header wordmark. -->
  <defs>
    <linearGradient id="ocl-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ea2b5" />
      <stop offset="50%" stop-color="#8470cc" />
      <stop offset="100%" stop-color="#b56eaa" />
    </linearGradient>
    <filter id="star-glow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="halo" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near" />
      <feMerge>
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="near" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
