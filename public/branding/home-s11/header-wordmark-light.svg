    <path id="C-angular" d="M64 0H229L221 52H96L85 63L58 197L66 208H195L185 260H22L0 235L39 29Z" transform="translate(330.58 71.2) scale(.96)" fill="url(#ocl-fill)" stroke="#9392b5" stroke-width="1.4" stroke-linejoin="miter" stroke-miterlimit="4" fill-rule="evenodd" />
