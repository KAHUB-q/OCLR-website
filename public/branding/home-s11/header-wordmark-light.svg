          <feGaussianBlur in="inset" stdDeviation="23" result="feathered" />
          <feComposite in="feathered" in2="SourceAlpha" operator="in" result="center-mask" />
          <feFlood flood-color="#715884" result="center-color" />
          <feComposite in="center-color" in2="center-mask" operator="in" result="center-shading" />
          <feMerge>
